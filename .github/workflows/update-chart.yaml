#
# This workflow creates a PR with changes pulled from upstream repo using the `make update-chart` command.
# It also updates the Chart.yaml dependencies on local subcharts update.

name: Create Update Chart PR

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
      chart_dir:
        description: Path to the Helm chart directory under helm/ (e.g. helm/myapp). Resolved from the repository name if not set.
        required: false
        type: string
      update_existing:
        description: >-
          Run `make update-chart` on the branch even when its PR is already open,
          and only skip opening the PR. sync-from-upstream sets it: it rebuilds
          the update branch from the Renovate branch on every push, so the Giant
          Swarm delta has to be re-applied every time. A push-triggered caller
          leaves it off, so once the PR is open a later push to the branch (by
          hand, or sync-from-upstream's) does not run the update again. Its run
          on this workflow's own update commit is skipped by the commit's
          Update-Chart-Workflow-Run trailer instead (see gather_facts).
        default: false
        required: false
        type: boolean
    secrets:
      RELEASE_BOT_CLIENT_ID:
        description: Client ID of the giantswarm-release GitHub App, which pushes, tags and opens PRs.
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: Private key of the giantswarm-release GitHub App.
        required: false
      TAYLORBOT_GITHUB_ACTION:
        description: Deprecated taylorbot token, used only when the giantswarm-release App secrets are not passed (giantswarm/giantswarm#2280).
        required: false

permissions: {}

jobs:
  debug_info:
    name: Debug info
    runs-on: ubuntu-26.04
    steps:
      - name: Print github context JSON
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
  gather_facts:
    name: Gather facts
    runs-on: ubuntu-26.04
    outputs:
      repo_name: ${{ steps.gather_facts.outputs.repo_name }}
      branch: ${{ steps.gather_facts.outputs.branch }}
      base: ${{ steps.gather_facts.outputs.base }}
      skip: ${{ steps.own_commit.outputs.skip == 'true' || steps.pr_exists.outputs.skip == 'true' }}
      pr_exists: ${{ steps.pr_exists.outputs.pr_exists }}
      use_app: ${{ steps.credentials.outputs.use_app }}
    steps:
      - name: Check release credentials
        id: credentials
        env:
          HAS_CLIENT_ID: ${{ secrets.RELEASE_BOT_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY != '' }}
          HAS_TAYLORBOT_TOKEN: ${{ secrets.TAYLORBOT_GITHUB_ACTION != '' }}
        run: |
          set -euo pipefail
          if [[ "${HAS_CLIENT_ID}" == "true" && "${HAS_PRIVATE_KEY}" == "true" ]]; then
            echo "use_app=true" >> "$GITHUB_OUTPUT"
          elif [[ "${HAS_CLIENT_ID}" == "true" || "${HAS_PRIVATE_KEY}" == "true" ]]; then
            echo "::error::Only one of RELEASE_BOT_CLIENT_ID and RELEASE_BOT_PRIVATE_KEY is passed. Pass both."
            exit 1
          elif [[ "${HAS_TAYLORBOT_TOKEN}" == "true" ]]; then
            echo "::warning::No giantswarm-release App secrets passed, using the deprecated taylorbot token (giantswarm/giantswarm#2280). Regenerate the workflows with devctl."
            echo "use_app=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Pass RELEASE_BOT_CLIENT_ID and RELEASE_BOT_PRIVATE_KEY (or the deprecated TAYLORBOT_GITHUB_ACTION) to this workflow."
            exit 1
          fi
      - name: Gather facts
        id: gather_facts
        # Refs come in through env, never as ${{ }} in the script: a ref name may contain
        # $, ( and backticks, which the shell would run.
        env:
          HEAD_REF: ${{ inputs.branch || github.event.ref }}
          BASE_REF: ${{ github.event.base_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          head="${HEAD_REF}"
          echo "branch=${head}" >> $GITHUB_OUTPUT

          head="${head#refs/heads/}" # Strip "refs/heads/" prefix.
          if [[ $(echo "$head" | grep -o '#' | wc -l) -ge 1 ]]; then
            base="$(echo "$head" | cut -d '#' -f 1)"
          else
            base="${BASE_REF}"
          fi

          base="${base#refs/heads/}" # Strip "refs/heads/" prefix.

          repo_name="$(echo "${REPOSITORY}" | awk -F '/' '{print $2}')"
          echo "repo_name=\"$repo_name\" base=\"$base\" head=\"$head\""
          echo "repo_name=${repo_name}" >> $GITHUB_OUTPUT
          echo "base=${base}" >> $GITHUB_OUTPUT
          echo "head=${head}" >> $GITHUB_OUTPUT
      - name: Check for own update commit
        id: own_commit
        env:
          BRANCH: ${{ steps.gather_facts.outputs.branch }}
          DELETED: ${{ github.event.deleted }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          HAS_HEAD_COMMIT: ${{ github.event.head_commit != null }}
          HEAD_COMMIT_DISTINCT: ${{ github.event.head_commit.distinct }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A push of this workflow's own update commit (sync-from-upstream's call pushes it
          # before it opens the PR) must not run `make update-chart` again: the second run
          # pushes a commit that only changes the Chart.lock timestamp and races
          # sync-and-update's push. Only a push to the branch being updated is checked;
          # sync-from-upstream's own call runs on a push to the Renovate branch or a dispatch.
          # The skip does not look for an open PR: if the call that pushed the commit failed
          # to open it, rerun that call or dispatch sync-from-upstream.
          branch="refs/heads/${BRANCH#refs/heads/}"
          if [[ "${EVENT_NAME}" != "push" || "${branch}" != "${EVENT_REF}" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${DELETED}" == "true" ]]; then
            echo "The branch was deleted, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The head commit comes from the push payload. A push without one fails the step,
          # it is never read as "no trailer".
          if [[ "${HAS_HEAD_COMMIT}" != "true" ]]; then
            echo "::error::The push event carries no head commit"
            exit 1
          fi
          # Only a commit new to the repository counts. A squash- or rebase-merged update PR
          # leaves the trailer on main's tip, and pushing main to the branch to start a new
          # update pushes that commit again, not distinct.
          trailers=$(git interpret-trailers --parse <<< "${HEAD_COMMIT_MESSAGE}")
          if [[ "${HEAD_COMMIT_DISTINCT}" == "true" ]] && grep -q '^Update-Chart-Workflow-Run: ' <<< "${trailers}"; then
            echo "Head commit ${SHA} is this workflow's own update commit, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate release token
        id: release_token
        if: ${{ steps.credentials.outputs.use_app == 'true' && steps.own_commit.outputs.skip != 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Contents read on top of Pull requests read: without it gh failed to read the repository
          # (repository.defaultBranchRef) and the open-PR check below ran blind.
          permission-contents: read
          permission-pull-requests: read
      - name: Check if PR exists
        id: pr_exists
        if: ${{ steps.own_commit.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: "${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}"
          UPDATE_EXISTING: ${{ inputs.update_existing }}
          BRANCH: ${{ steps.gather_facts.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          head="${BRANCH}"
          branch="${head#refs/heads/}" # Strip "refs/heads/" prefix.
          # The open pull request of the branch. A failed read fails the step (bash -e): reading
          # an error (a missing token permission, a rate limit) as "no PR" re-ran the job on its
          # own push and pushed again, without end.
          pr_url=$(gh pr list --repo "${REPOSITORY}" --head "${branch}" --state open --json url --jq '.[0].url // ""')
          if [[ -n "${pr_url}" ]]; then
            echo "Open pull request: ${pr_url}"
            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
            if [[ "${UPDATE_EXISTING}" == "true" ]]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
  create_update_pr:
    name: Create update PR
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    needs:
      - gather_facts
    if: ${{ needs.gather_facts.outputs.skip != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gather_facts.outputs.branch }}
          # Without this the checkout's GITHUB_TOKEN header would authenticate the
          # push below instead of the release token in its URL, and a push made with
          # GITHUB_TOKEN does not trigger CI on the update PR.
          persist-credentials: false
      - name: Install vendir
        run: |
          wget https://github.com/vmware-tanzu/carvel-vendir/releases/download/v0.32.2/vendir-linux-amd64 -O /tmp/vendir
          SHA_VENDIR=`shasum -a 256 /tmp/vendir | cut -d ' ' -f1`
          [ "$SHA_VENDIR" != "f5d3cbbd8135d2d48f4f007b8a933bd60b2a827d68f4001c5d1774392fa7b3f2" ] && echo "invalid vendir binary" && exit 1
          sudo mv /tmp/vendir /usr/local/bin/vendir && chmod a+x /usr/local/bin/vendir
      - name: Run update
        env:
          CHART_DIR_INPUT: ${{ inputs.chart_dir }}
          REPO_NAME: ${{ needs.gather_facts.outputs.repo_name }}
        run: |
          # Define chart name. The Makefile prepends the "helm/" prefix itself,
          # so APPLICATION must be the bare chart name without it.
          repository="${REPO_NAME}"
          chart="${repository}"

          if [ -n "${CHART_DIR_INPUT}" ]
          then
            chart_dir="${CHART_DIR_INPUT%/}"
            if [[ "${chart_dir}" =~ (^|/)(\.\.?)?(/|$) ]]
            then
              echo "::error::chart_dir input '${CHART_DIR_INPUT}' must be a relative path without empty, . or .. components (e.g. helm/myapp)"
              exit 1
            fi
            if [ "${chart_dir#helm/}" = "${chart_dir}" ] || [ ! -f "${chart_dir}/Chart.yaml" ]
            then
              echo "::error::chart_dir input '${CHART_DIR_INPUT}' is not a directory under helm/ that contains Chart.yaml (e.g. helm/myapp)"
              exit 1
            fi
            chart="${chart_dir#helm/}"
          # Check chart directory.
          elif [ ! -d "helm/${chart}" ]
          then
            echo "Could not find chart directory 'helm/${chart}', removing app suffix."

            # Remove app suffix.
            chart="${repository%-app}"

            if [ ! -d "helm/${chart}" ]
            then
              # Print error.
              echo "Could not find chart directory 'helm/${chart}', doing nothing."
              exit 1
            fi
          fi

          make update-chart APPLICATION="${chart}"
      - name: Generate release token
        id: release_token
        if: ${{ needs.gather_facts.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Set up git identity
        env:
          USE_APP: ${{ needs.gather_facts.outputs.use_app }}
          APP_SLUG: ${{ steps.release_token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: |
          if [[ "${USE_APP}" == "true" ]]; then
            # The noreply email needs the bot's user id, the API knows it from the App slug.
            bot_name="${APP_SLUG}[bot]"
            bot_id="$(gh api "/users/${bot_name}" --jq .id)"
            git config --local user.name "${bot_name}"
            git config --local user.email "${bot_id}+${bot_name}@users.noreply.github.com"
          else
            git config --local user.email "dev@giantswarm.io"
            git config --local user.name "taylorbot"
          fi
      - name: Create update commit
        id: commit
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "make update-chart changed nothing; nothing to push"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            # gather_facts skips a push whose head commit carries this trailer.
            git commit -m "chore(chart): automated update from upstream" -m "Update-Chart-Workflow-Run: ${RUN_ID}"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push changes
        if: steps.commit.outputs.committed == 'true'
        env:
          remote_repo: "https://x-access-token:${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}@github.com/${{ github.repository }}.git"
          BRANCH: ${{ needs.gather_facts.outputs.branch }}
        run: |
          git push "${remote_repo}" "HEAD:${BRANCH}"
      - name: Ensure automated-update label exists
        if: needs.gather_facts.outputs.pr_exists != 'true'
        env:
          GITHUB_TOKEN: "${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}"
          REPOSITORY: ${{ github.repository }}
        run: |
          gh label create automated-update \
            --repo "${REPOSITORY}" \
            --color e86d00 \
            --description "Used to identify automated updates from upstream-forks" \
            --force
      - name: Update PR
        if: needs.gather_facts.outputs.pr_exists != 'true'
        env:
          GITHUB_TOKEN: "${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}"
          base: "${{ needs.gather_facts.outputs.base }}"
          head: "${{ needs.gather_facts.outputs.branch }}"
          ACTOR: ${{ github.actor }}
        run: |
          gh pr create \
            --title "chore(chart): automated update from upstream" \
            --label "automated-update" \
            --base "${base}" \
            --head "${head}" \
            --body-file - << EOF
          This PR was created by the \`update-chart\` GitHub Actions workflow.
          - [ ] **:warning: All tests are passing**
          - [ ] **:warning: The CHANGELOG.md file has been updated**
          - [ ] **:warning: Additional changes in ignored files (see vendir.yml) have been adapted and migrated**
          EOF

          # Splitting this into two calls to handle errors when renovate triggers it
          gh pr edit --add-assignee "${ACTOR}" || true
