name: Chart unit tests

on:
  workflow_call: {}

permissions: {}

jobs:
  helm-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # helm-unittest renders the chart and asserts on the rendered manifests:
      # no cluster, no image, no built chart. The Makefile target pins the
      # plugin version, so this run and a developer's run are the same run.
      # helm itself comes from the runner image. The target exits 0 with a
      # message when the repository carries no suites, so a caller without
      # chart tests stays green.
      # Align-files ships this caller and the regenerated Makefile.gen.app.mk in
      # one pull request. A repository that carries the caller alone has no
      # helm-test target, and it cannot fix that here, so skip. Every other make
      # error still fails the job.
      - name: Run chart unit tests
        run: |
          if err=$(make -n helm-test 2>&1); then
            make helm-test
          elif printf '%s' "$err" | grep -q "No rule to make target .helm-test."; then
            echo "::notice::No helm-test target. Regenerate Makefile.gen.app.mk with devctl gen makefile."
          else
            printf '%s\n' "$err"
            exit 1
          fi
