name: Create Release PR

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch (full ref) to use for this PR"
        required: true
        type: string
    secrets:
      RELEASE_BOT_CLIENT_ID:
        description: Client ID of the giantswarm-release GitHub App, which pushes, tags and opens PRs.
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: Private key of the giantswarm-release GitHub App.
        required: false
      TAYLORBOT_GITHUB_ACTION:
        description: Deprecated taylorbot token, used only when the giantswarm-release App secrets are not passed (giantswarm/giantswarm#2280).
        required: false

permissions: {}

jobs:
  debug_info:
    name: Debug info
    runs-on: ubuntu-26.04
    steps:
      - name: Print github context JSON
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
  gather_facts:
    name: Gather facts
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      repo_name: ${{ steps.parse.outputs.repo_name }}
      branch: ${{ steps.parse.outputs.branch }}
      base: ${{ steps.parse.outputs.base }}
      needs_major_bump: ${{ steps.resolve.outputs.needs_major_bump }}
      skip: ${{ steps.check_skip.outputs.skip }}
      version: ${{ steps.resolve.outputs.version }}
      is_rc: ${{ steps.resolve.outputs.is_rc }}
      use_app: ${{ steps.credentials.outputs.use_app }}
    steps:
      - name: Check release credentials
        id: credentials
        env:
          HAS_CLIENT_ID: ${{ secrets.RELEASE_BOT_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY != '' }}
          HAS_TAYLORBOT_TOKEN: ${{ secrets.TAYLORBOT_GITHUB_ACTION != '' }}
        run: |
          set -euo pipefail
          if [[ "${HAS_CLIENT_ID}" == "true" && "${HAS_PRIVATE_KEY}" == "true" ]]; then
            echo "use_app=true" >> "$GITHUB_OUTPUT"
          elif [[ "${HAS_CLIENT_ID}" == "true" || "${HAS_PRIVATE_KEY}" == "true" ]]; then
            echo "::error::Only one of RELEASE_BOT_CLIENT_ID and RELEASE_BOT_PRIVATE_KEY is passed. Pass both."
            exit 1
          elif [[ "${HAS_TAYLORBOT_TOKEN}" == "true" ]]; then
            echo "::warning::No giantswarm-release App secrets passed, using the deprecated taylorbot token (giantswarm/giantswarm#2280). Regenerate the workflows with devctl."
            echo "use_app=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Pass RELEASE_BOT_CLIENT_ID and RELEASE_BOT_PRIVATE_KEY (or the deprecated TAYLORBOT_GITHUB_ACTION) to this workflow."
            exit 1
          fi
      - name: Parse trigger
        id: parse
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          EVENT_REF: ${{ github.event.ref }}
          EVENT_BASE_REF: ${{ github.event.base_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          head="${INPUT_BRANCH:-$EVENT_REF}"
          echo "branch=${head}" >> $GITHUB_OUTPUT

          head_short="${head#refs/heads/}"
          if [[ $(echo "$head_short" | grep -o '#' | wc -l) -gt 1 ]]; then
            base="$(echo "$head_short" | cut -d '#' -f 1)"
          else
            base="${EVENT_BASE_REF}"
          fi
          base="${base#refs/heads/}"

          token="$(echo "$head_short" | awk -F# '{print $NF}')"
          repo_name="$(echo "$REPOSITORY" | awk -F '/' '{print $2}')"

          echo "base=${base}" >> $GITHUB_OUTPUT
          echo "token=${token}" >> $GITHUB_OUTPUT
          echo "repo_name=${repo_name}" >> $GITHUB_OUTPUT
          echo "branch=${head}  base=${base}  token=${token}  repo=${repo_name}"

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.parse.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitsemver
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: "gitsemver"
          # renovate: datasource=github-releases depName=giantswarm/gitsemver
          version: v3.0.7
          # Raw binary, not the legacy `-${version}-linux-amd64.tar.gz`: those tarballs only exist
          # for repos passing `build-release-artifacts: true` to create-release.yaml, and gitsemver
          # stopped doing that in giantswarm/gitsemver#260. Extension-less URLs skip unarchiving,
          # so no `tarball_binary_path` is needed.
          download_url: "https://github.com/giantswarm/${binary}/releases/download/${version}/${binary}-linux-amd64"
          smoke_test: "${binary} --version"

      - name: Resolve version
        id: resolve
        env:
          TOKEN: ${{ steps.parse.outputs.token }}
        run: |
          set -euo pipefail
          bump_tokens='^(major|minor|patch|major-rc|minor-rc|patch-rc|rc|rc-release)$'
          if [[ "$TOKEN" =~ $bump_tokens ]]; then
            version="$(gitsemver next "$TOKEN")"
          else
            candidate="${TOKEN#v}"
            if ! gitsemver validate --type any "$candidate" >/dev/null 2>&1; then
              echo "::error::Invalid version '$candidate' (must be valid semver per gitsemver)"
              exit 1
            fi
            version="$candidate"
          fi
          echo "version=${version}"
          echo "version=${version}" >> $GITHUB_OUTPUT

          # Detect a "new major" release (including its RC) for the go.mod
          # upgrade step downstream. A "new major" means X.0.0 (or X.0.0-rc.N)
          # with X > 1; X=1 is excluded to preserve legacy behaviour.
          core="${version%%-*}"
          IFS=. read -r vmaj vmin vpat <<<"$core"
          if [[ "$vmin" = "0" && "$vpat" = "0" && "$vmaj" != "1" && "$vmaj" -gt 0 ]]; then
            echo "needs_major_bump=true" >> $GITHUB_OUTPUT
          fi

          is_rc=false
          if gitsemver validate --type rc "$version" >/dev/null 2>&1; then
            is_rc=true
          fi
          echo "is_rc=${is_rc}" >> $GITHUB_OUTPUT

      - name: Generate release token
        id: release_token
        if: ${{ steps.credentials.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
      - name: Check if workflow should be skipped
        id: check_skip
        env:
          GITHUB_TOKEN: "${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}"
          # Refs come in through env, never as ${{ }} in the script: a ref name may contain
          # $, ( and backticks, which the shell would run.
          HEAD_REF: ${{ steps.parse.outputs.branch }}
          BASE: ${{ steps.parse.outputs.base }}
          REPOSITORY: ${{ github.repository }}
        run: |
          head="${HEAD_REF}"
          branch="${head#refs/heads/}" # Strip "refs/heads/" prefix.

          # Check if PR already exists
          # The open pull request of the branch. A failed read fails the step (bash -e): reading
          # an error (a missing token permission, a rate limit) as "no PR" re-ran the job on its
          # own push and pushed again, without end.
          pr_url=$(gh pr list --repo "${REPOSITORY}" --head "${branch}" --state open --json url --jq '.[0].url // ""')
          if [[ -n "${pr_url}" ]]; then
            echo "Open pull request: ${pr_url}"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if the triggering commit was created by this workflow (has our trailer).
          # Only apply this check when the release branch is ahead of the base — if
          # ahead_by is 0, the branch was just created from the base and the trailer
          # (if present) belongs to a previous unrelated release on the base branch.
          # Both lookups fail the step on an error, as above: reading an error as "not ahead" or
          # "no trailer" lets the job run on its own push again. Release branches carry "#"
          # (main#release#patch), which ends the URL path unless it is encoded.
          base="${BASE}"
          # A release branch with a single "#" (release#minor-rc) takes its base from the push
          # event, which a branch creation leaves empty: no base, nothing to compare against.
          ahead_by=0
          if [[ -n "${base}" ]]; then
            ahead_by=$(gh api "repos/${REPOSITORY}/compare/${base//#/%23}...${branch//#/%23}" --jq '.ahead_by')
          fi
          if [[ "$ahead_by" -gt "0" ]]; then
            commit_message=$(gh api "repos/${REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.message')
            if [[ "$commit_message" == *"Release-Workflow-Run:"* ]]; then
              echo "Triggering commit was created by release workflow, skipping"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

  prepare_release_pr:
    name: Prepare release PR for Backstage project
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    needs:
      - gather_facts
    if: ${{ needs.gather_facts.outputs.skip != 'true' && github.repository == 'giantswarm/backstage' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gather_facts.outputs.branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: borales/actions-yarn@3766bb1335b98fb13c60eaf358fe20811b730a88 # v5.0.0
        with:
          cmd: install
      - name: Prepare release PR
        uses: borales/actions-yarn@3766bb1335b98fb13c60eaf358fe20811b730a88 # v5.0.0
        with:
          cmd: release
        env:
          RELEASE_VERSION: ${{ needs.gather_facts.outputs.version }}
      - name: Generate release token
        id: release_token
        if: ${{ needs.gather_facts.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Set up git identity
        env:
          USE_APP: ${{ needs.gather_facts.outputs.use_app }}
          APP_SLUG: ${{ steps.release_token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: |
          if [[ "${USE_APP}" == "true" ]]; then
            # The noreply email needs the bot's user id, the API knows it from the App slug.
            bot_name="${APP_SLUG}[bot]"
            bot_id="$(gh api "/users/${bot_name}" --jq .id)"
            git config --local user.name "${bot_name}"
            git config --local user.email "${bot_id}+${bot_name}@users.noreply.github.com"
          else
            git config --local user.email "dev@giantswarm.io"
            git config --local user.name "taylorbot"
          fi
      - name: Create commit
        env:
          version: "${{ needs.gather_facts.outputs.version }}"
        run: |
          git add -A
          git commit -m "chore(release): v${version} - version packages" -m "Release-Workflow-Run: ${GITHUB_RUN_ID}"
      - name: Push changes
        env:
          remote_repo: "https://x-access-token:${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}@github.com/${{ github.repository }}.git"
          BRANCH: ${{ needs.gather_facts.outputs.branch }}
        run: |
          git push "${remote_repo}" "HEAD:${BRANCH}"

  create_release_pr:
    name: Create release PR
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    needs:
      - gather_facts
      - prepare_release_pr
    # Runs when prepare_release_pr is skipped (every repo but backstage), but not
    # when gather_facts or prepare_release_pr failed or the run was cancelled.
    # A status function in `if` replaces the implicit success(), which would skip
    # this job whenever prepare_release_pr is skipped, so do not use success() here.
    if: ${{ !cancelled() && !failure() && needs.gather_facts.result == 'success' && needs.gather_facts.outputs.skip != 'true' }}
    steps:
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '=1.26.6'
      - name: Install architect
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: architect
          # renovate: datasource=github-tags depName=giantswarm/architect
          version: v8.6.20
          download_url: "https://github.com/giantswarm/architect/releases/download/${version}/architect-linux-amd64"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gather_facts.outputs.branch }}
          persist-credentials: false
      - name: Prepare release changes
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ needs.gather_facts.outputs.repo_name }}
          VERSION: ${{ needs.gather_facts.outputs.version }}
        run: |
          architect prepare-release --organisation "${OWNER}" --project "${REPO_NAME}" --version "${VERSION}"
      - name: Update version field in Chart.yaml
        env:
          REPO_NAME: ${{ needs.gather_facts.outputs.repo_name }}
          VERSION: ${{ needs.gather_facts.outputs.version }}
        run: |
          # Define chart_dir
          repository="${REPO_NAME}"
          chart="helm/${repository}"

          # Check chart directory.
          if [ ! -d "${chart}" ]
          then
            echo "Could not find chart directory '${chart}', adding app suffix."

            # Add app suffix.
            chart="helm/${repository}-app"

            # Check chart directory with app suffix.
            if [ ! -d "${chart}" ]
            then
              echo "Could not find chart directory '${chart}', removing app suffix."

              # Remove app suffix.
              chart="helm/${repository%-app}"

              if [ ! -d "${chart}" ]
              then
                # Print error.
                echo "Could not find chart directory '${chart}', doing nothing."
              fi
            fi
          fi

          # Define chart YAML.
          chart_yaml="${chart}/Chart.yaml"

          # Check chart YAML.
          if [ -f "${chart_yaml}" ]
          then
            # check if version in Chart.yaml is templated using architect
            if [ $(grep -c "^version:.*\.Version.*$" "${chart_yaml}") = "0" ]; then
              yq -i '.version = strenv(VERSION)' "${chart_yaml}"
            fi

            # Check if ABS is configured for the project.
            if [ -f ".abs/main.yaml" ]; then
              # Check if replace-app-version-with-git is enabled in ABS config.
              if [ "$(yq '.replace-app-version-with-git' '.abs/main.yaml')" = "true" ]; then
                yq -i '.appVersion = strenv(VERSION)' "${chart_yaml}"
              fi
            fi
          fi

      - name: Bump go module defined in go.mod if needed
        env:
          NEEDS_MAJOR_BUMP: ${{ needs.gather_facts.outputs.needs_major_bump }}
        run: |
          if [ "${NEEDS_MAJOR_BUMP}" = true ] && test -f "go.mod"; then
            go install github.com/marwan-at-work/mod/cmd/mod@v0.9.0
            mod upgrade
          fi
      - name: Generate release token
        id: release_token
        if: ${{ needs.gather_facts.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Set up git identity
        env:
          USE_APP: ${{ needs.gather_facts.outputs.use_app }}
          APP_SLUG: ${{ steps.release_token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: |
          if [[ "${USE_APP}" == "true" ]]; then
            # The noreply email needs the bot's user id, the API knows it from the App slug.
            bot_name="${APP_SLUG}[bot]"
            bot_id="$(gh api "/users/${bot_name}" --jq .id)"
            git config --local user.name "${bot_name}"
            git config --local user.email "${bot_id}+${bot_name}@users.noreply.github.com"
          else
            git config --local user.email "dev@giantswarm.io"
            git config --local user.name "taylorbot"
          fi
      - name: Create release commit
        env:
          version: "${{ needs.gather_facts.outputs.version }}"
        run: |
          git add -A
          git commit -m "chore(release): v${version}" -m "Release-Workflow-Run: ${GITHUB_RUN_ID}"
      - name: Push changes
        env:
          remote_repo: "https://x-access-token:${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}@github.com/${{ github.repository }}.git"
          BRANCH: ${{ needs.gather_facts.outputs.branch }}
        run: |
          git push "${remote_repo}" "HEAD:${BRANCH}"
      - name: Create PR
        env:
          GITHUB_TOKEN: "${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}"
          actor: "${{ github.actor }}"
          base: "${{ needs.gather_facts.outputs.base }}"
          branch: "${{ needs.gather_facts.outputs.branch }}"
          version: "${{ needs.gather_facts.outputs.version }}"
        run: |
          # A repo can ship a release PR body in .github/release-pr-body.md. It is used
          # verbatim, so a repo whose CI is triggered from the PR body - e.g. Tekton's
          # `/run cluster-test-suites` - gets its tests run on the release PR without
          # anyone having to remember to comment. Repos without the file keep an empty
          # body, as before.
          body_file=".github/release-pr-body.md"
          if [ -f "${body_file}" ]; then
            echo "Using release PR body from ${body_file}"
            body="$(cat "${body_file}")"
          else
            body=""
          fi

          # Values come from the step environment rather than template expansions, which
          # would be interpolated into the script before it runs.
          gh pr create \
            --assignee "${actor}" \
            --title "chore(release): v${version}" \
            --body "${body}" \
            --base "${base}" \
            --head "${branch}"
