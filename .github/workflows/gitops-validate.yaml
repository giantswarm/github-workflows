name: GitOps Validate

# Reusable workflow for validating a GitOps repository created from
# giantswarm/gitops-template. It runs the repo's pre-commit hooks, its
# `./tools/test-all-ff validate`, posts a dyff of the rendered manifests
# against the pull request's base branch, and runs the `tests/ats` kind-based
# e2e suite. A diff too long for one PR comment is split across several, each
# headed "Rendered manifest diff output log (part N of M)".
#
# A called (workflow_call) workflow checks out the *caller* repository, so
# `tools/test-all-ff` and `tests/ats` resolve against the consumer with no
# extra wiring. Consumers pass the GITOPS_MASTER_GPG_KEY secret and may
# override the tool-version / gitops-* inputs (defaults match gitops-template).
#
# Pull requests from forks: GitHub hands them no secrets and a read-only token.
# GITOPS_MASTER_GPG_KEY is therefore optional, and the caller's tests decide
# what an empty key means (gitops-template skips its kind tests on a fork pull
# request and fails anywhere else). The validation and diff output goes to the
# job summary instead of a PR comment, which the token cannot post. A diff
# bigger than a job summary holds is uploaded whole as the
# `rendered-manifest-diff` artifact, and the summary shows its start.

on:
  workflow_call:
    inputs:
      kubeconform_ver:
        type: string
        default: "0.8.0"
        description: "kubeconform release version to install."
      dyff_ver:
        type: string
        default: "1.12.0"
        description: "dyff release version to install."
      clusterctl_ver:
        type: string
        default: "1.14.4"
        description: "clusterctl release version to install."
      apptestctl_ver:
        type: string
        default: "0.27.0"
        description: "apptestctl release version to install."
      kind_ver:
        type: string
        default: "0.33.0"
        description: "kind release version for the e2e cluster."
      gitops_flux_app_version:
        type: string
        default: "1.12.2"
        description: "Flux app version used by the e2e tests."
      gitops_init_namespaces:
        type: string
        default: "default,org-org-name"
        description: "Namespaces the e2e tests initialise."
      gitops_ignored_objects:
        type: string
        default: "org-org-name/clusters-mapi-out-of-band-no-flux-direct"
        description: "Objects the e2e tests ignore."
      python_version:
        type: string
        default: "3.12"
        description: "Python version for the e2e test suite."
    secrets:
      GITOPS_MASTER_GPG_KEY:
        # Optional so a pull request from a fork, which gets an empty value,
        # can call this workflow at all. The caller's tests fail on an empty
        # key wherever it should have been set.
        required: false
        description: "Master GPG key used by the e2e tests to decrypt SOPS-encrypted fixtures."

permissions: {}

jobs:
  check-pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: sudo snap install shfmt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - name: cache pre-commit environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-gitops-validate-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  validate:
    needs: check-pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITOPS_FLUX_APP_VERSION: ${{ inputs.gitops_flux_app_version }}
      GITOPS_INIT_NAMESPACES: ${{ inputs.gitops_init_namespaces }}
      GITOPS_IGNORED_OBJECTS: ${{ inputs.gitops_ignored_objects }}
      # A pull request from a fork, or from one that has since been deleted
      # (head.repo is then null). Its token is read-only, so it cannot comment.
      FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - run: sudo apt-get install -y yamllint
      - run: curl -s https://fluxcd.io/install.sh | sudo bash
      - uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: kubeconform
          download_url: "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz"
          smoke_test: "${binary} -v"
          tarball_binary_path: "${binary}"
          version: ${{ inputs.kubeconform_ver }}
      - name: cache validation tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-gitops-validate-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run validation
        uses: mathiasvr/command-output@34408ea3d0528273faff3d9e201761ae96106cd0 # v2.0.0
        id: validate
        with:
          run: "./tools/test-all-ff validate"
      - name: Find validation comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        # Always look up the previous validation comment, whether validation passed or not.
        # See: https://docs.github.com/en/actions/learn-github-actions/expressions#always
        if: always() && github.ref_name != 'main' && env.FORK_PULL_REQUEST != 'true'
        continue-on-error: true
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: Validation output log
      - name: Delete old comment
        uses: winterjung/comment@fda92dbcb5e7e79cccd55ecb107a8a3d7802a469 # v1.1.0
        if: always() && github.ref_name != 'main' && env.FORK_PULL_REQUEST != 'true'
        continue-on-error: true
        with:
          type: delete
          comment_id: ${{ steps.fc.outputs.comment-id }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write validation log to the job summary
        if: always() && env.FORK_PULL_REQUEST == 'true'
        env:
          VALIDATION_LOG: ${{ steps.validate.outputs.stdout }}
        run: |
          echo "::notice title=No PR comment::Pull request from a fork: its token cannot comment, so the validation log is in the job summary."
          {
            echo "### Validation output log"
            echo
            echo '```'
            printf '%s\n' "${VALIDATION_LOG}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Create or update validation comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: always() && github.ref_name != 'main' && env.FORK_PULL_REQUEST != 'true'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <details>
            <summary> Validation output log </summary>
            <!-- mandatory empty line -->

            ```
            ${{ steps.validate.outputs.stdout }}
            ```

            </details>
            <!-- mandatory empty line -->

  get-diff:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    env:
      GITOPS_FLUX_APP_VERSION: ${{ inputs.gitops_flux_app_version }}
      GITOPS_INIT_NAMESPACES: ${{ inputs.gitops_init_namespaces }}
      GITOPS_IGNORED_OBJECTS: ${{ inputs.gitops_ignored_objects }}
      # See the validate job.
      FORK_PULL_REQUEST: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      # The dyff output. It is only ever read from this file: passed to an
      # action as an input or an environment variable, a diff over 128 KiB
      # (Linux's MAX_ARG_STRLEN) stops the action's process from starting.
      DIFF_FILE: /tmp/rendered-manifest-diff.txt
    steps:
      - run: sudo apt-get install -y yamllint
      - run: curl -s https://fluxcd.io/install.sh | sudo bash
      - name: install dyff
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: dyff
          download_url: "https://github.com/homeport/dyff/releases/download/v${version}/dyff_${version}_linux_amd64.tar.gz"
          smoke_test: "${binary} version"
          tarball_binary_path: "${binary}"
          version: ${{ inputs.dyff_ver }}
      - run: which dyff
      - uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: kubeconform
          download_url: "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz"
          smoke_test: "${binary} -v"
          tarball_binary_path: "${binary}"
          version: ${{ inputs.kubeconform_ver }}
      - run: which kubeconform
      - run: ls -la /opt/hostedtoolcache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: template all for the new branch
        run: ./tools/test-all-ff template > /tmp/new.yaml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request's own base, so a pull request into a branch other
          # than main diffs against that branch, not against everything the
          # branch has diverged from main.
          ref: ${{ github.base_ref }}
          path: "old"
      - name: template all for the old branch
        run: cd old/ && ../tools/test-all-ff template > /tmp/old.yaml && cd ..
      - name: save the diff
        id: diff
        # dyff -s exits 0 for no differences, 1 for differences and 255 on an
        # error. None of them fails the step: the comment says which it was.
        run: |
          rc=0
          dyff between -s -i -b -g /tmp/old.yaml /tmp/new.yaml > "${DIFF_FILE}" || rc=$?
          case "${rc}" in
            0) echo "No diff detected" >> "${DIFF_FILE}" ;;
            1) ;;
            *) echo "Diff error" >> "${DIFF_FILE}" ;;
          esac
          cat "${DIFF_FILE}"
          # A step's job summary holds at most 1 MiB; leave room for the heading.
          if [ "$(stat -c %s "${DIFF_FILE}")" -gt 1000000 ]; then
            echo "too_big_for_summary=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Replace the diff comments
        if: env.FORK_PULL_REQUEST != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="Rendered manifest diff output log"
          comments="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
          work=$(mktemp -d)

          # Delete every part of the previous diff comment. As before, a comment
          # that cannot be found or deleted does not stop the new one.
          if ! gh api --paginate "${comments}" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
            > "${work}/old-comments"; then
            echo "::warning title=Old diff comments kept::Could not list the pull request's comments."
            : > "${work}/old-comments"
          fi
          while read -r id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" ||
              echo "::warning title=Old diff comment kept::Could not delete comment ${id}."
          done < "${work}/old-comments"

          # A comment holds at most 65,536 characters. Split the diff at line
          # boundaries into parts of at most 60,000 bytes, which leaves room for
          # the wrapper below. Only a single line longer than that is cut.
          mkdir "${work}/parts"
          split --line-bytes=60000 --numeric-suffixes=1 --suffix-length=4 "${DIFF_FILE}" "${work}/parts/"
          mapfile -t parts < <(find "${work}/parts" -type f | sort)
          if [ "${#parts[@]}" -eq 0 ]; then
            : > "${work}/parts/0001"
            parts=("${work}/parts/0001")
          fi

          total=${#parts[@]}
          i=0
          for part in "${parts[@]}"; do
            i=$((i + 1))
            summary="${marker}"
            if [ "${total}" -gt 1 ]; then
              summary="${marker} (part ${i} of ${total})"
            fi
            {
              echo "<details>"
              echo "<summary> ${summary} </summary>"
              echo "<!-- mandatory empty line -->"
              echo
              echo '```'
              cat "${part}"
              # The closing fence needs its own line.
              if [ -n "$(tail -c 1 "${part}")" ]; then echo; fi
              echo '```'
              echo
              echo "</details>"
              echo "<!-- mandatory empty line -->"
            } > "${work}/body.md"
            # The body goes to the API from the file, as JSON on stdin.
            jq --raw-input --slurp '{body: .}' "${work}/body.md" |
              gh api --method POST "${comments}" --input - --silent
          done
      - name: Upload the diff as an artifact
        # Only when a fork pull request's diff is too big for its job summary.
        if: env.FORK_PULL_REQUEST == 'true' && steps.diff.outputs.too_big_for_summary == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-manifest-diff
          path: ${{ env.DIFF_FILE }}
          if-no-files-found: error
          overwrite: true
      - name: Write diff to the job summary
        if: env.FORK_PULL_REQUEST == 'true'
        env:
          TOO_BIG_FOR_SUMMARY: ${{ steps.diff.outputs.too_big_for_summary }}
        run: |
          echo "::notice title=No PR comment::Pull request from a fork: its token cannot comment, so the rendered manifest diff is in the job summary."
          shown="${DIFF_FILE}"
          if [ "${TOO_BIG_FOR_SUMMARY}" = "true" ]; then
            # The first 1,000,000 bytes, cut at a line boundary.
            work=$(mktemp -d)
            split --line-bytes=1000000 --numeric-suffixes=1 --suffix-length=4 "${DIFF_FILE}" "${work}/"
            shown="${work}/0001"
          fi
          {
            echo "### Rendered manifest diff output log"
            echo
            if [ "${TOO_BIG_FOR_SUMMARY}" = "true" ]; then
              echo "The diff is $(stat -c %s "${DIFF_FILE}") bytes, more than a job summary holds, so only its start is shown here. The full diff is in this run's \`rendered-manifest-diff\` artifact."
              echo
            fi
            echo '```'
            cat "${shown}"
            if [ -n "$(tail -c 1 "${shown}")" ]; then echo; fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  test_on_kind:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITOPS_FLUX_APP_VERSION: ${{ inputs.gitops_flux_app_version }}
      GITOPS_INIT_NAMESPACES: ${{ inputs.gitops_init_namespaces }}
      GITOPS_IGNORED_OBJECTS: ${{ inputs.gitops_ignored_objects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install apptestctl
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: apptestctl
          download_url: "https://github.com/giantswarm/apptestctl/releases/download/v${version}/apptestctl-linux-amd64"
          smoke_test: "${binary} version"
          version: ${{ inputs.apptestctl_ver }}
      - name: install clusterctl
        env:
          CLUSTERCTL_VER: ${{ inputs.clusterctl_ver }}
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/cluster-api/releases/download/v${CLUSTERCTL_VER}/clusterctl-linux-amd64" -o /usr/local/bin/clusterctl
          chmod +x /usr/local/bin/clusterctl
          clusterctl version
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: "v${{ inputs.kind_ver }}"
      - name: extract kind kube.config
        run: kind get kubeconfig --name 'chart-testing' > /tmp/kube.config
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ inputs.python_version }}"
      - name: Install pipenv
        run: python -m pip install --upgrade pipenv
      - name: install pipenv environment
        run: cd tests/ats && pipenv install --deploy
      - name: run tests
        run: cd tests/ats && pipenv run pytest .
        env:
          KUBECONFIG: /tmp/kube.config
          GITOPS_REPO_BRANCH: "${{ github.head_ref || github.ref_name }}"
          GITOPS_REPO_URL: "${{ github.server_url }}/${{ github.repository }}"
          GITOPS_MASTER_GPG_KEY: "${{ secrets.GITOPS_MASTER_GPG_KEY }}"
          # The tests run `clusterctl init`, which resolves provider versions
          # through the GitHub releases API. Unauthenticated that is 60 requests
          # per hour shared across every GitHub-hosted runner on the same egress
          # IP, and clusterctl reports exhaustion as the misleading "failed to
          # find releases tagged with a valid semantic version number".
          GITHUB_TOKEN: "${{ github.token }}"
