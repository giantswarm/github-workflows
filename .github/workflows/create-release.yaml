name: Create Release

on:
  workflow_call:
    inputs:
      build-release-artifacts:
        description: "Build and upload release artifacts for multiple platforms (CLI tools)"
        type: boolean
        default: false
      fetch-deep-gitlog-for-build:
        description: "Fetch full git history for build (needed in special cases only)"
        type: boolean
        default: false
    secrets:
      RELEASE_BOT_CLIENT_ID:
        description: Client ID of the giantswarm-release GitHub App, which pushes, tags and opens PRs.
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: Private key of the giantswarm-release GitHub App.
        required: false
      TAYLORBOT_GITHUB_ACTION:
        description: Deprecated taylorbot token, used only when the giantswarm-release App secrets are not passed (giantswarm/giantswarm#2280).
        required: false

permissions: {}

jobs:
  debug_info:
    name: Debug info
    runs-on: ubuntu-26.04
    steps:
      - name: Print github context JSON
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
  gather_facts:
    name: Gather facts
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      project_go_path: ${{ steps.get_project_go_path.outputs.path }}
      version: ${{ steps.get_version.outputs.version }}
      is_rc: ${{ steps.get_version.outputs.is_rc }}
      use_app: ${{ steps.credentials.outputs.use_app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitsemver
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: "gitsemver"
          # renovate: datasource=github-releases depName=giantswarm/gitsemver
          version: v3.0.8
          # Raw binary, not the legacy `-${version}-linux-amd64.tar.gz`: those tarballs only exist
          # for repos passing `build-release-artifacts: true` below, and gitsemver stopped doing
          # that in giantswarm/gitsemver#260. Extension-less URLs skip unarchiving, so no
          # `tarball_binary_path` is needed.
          download_url: "https://github.com/giantswarm/${binary}/releases/download/${version}/${binary}-linux-amd64"
          smoke_test: "${binary} --version"
      - name: Get version
        id: get_version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Accept release-PR titles of the form:
          #   - "chore(release): v1.2.3"
          #   - "chore(release): v1.2.3-rc.4"
          #   - "chore(release): v1.2.3 (#56)"
          # The legacy "Release v..." form is also accepted for backward
          # compatibility with PRs created by older versions of
          # create-release-pr.yaml. Anything else (no match) yields an empty
          # version output, which short-circuits the workflow as before.
          title=$(echo -n "${COMMIT_MESSAGE}" | head -1)
          version=""
          is_rc=false
          if echo "${title}" | grep -iqE '^(chore\(release\):|Release) v[^ ]+( \(#[0-9]+\))?$' ; then
            candidate=$(echo "${title}" | cut -d ' ' -f 2)
            candidate="${candidate#v}"
            if gitsemver validate --type any "${candidate}" >/dev/null 2>&1; then
              version="${candidate}"
              if gitsemver validate --type rc "${candidate}" >/dev/null 2>&1; then
                is_rc=true
              fi
            else
              echo "::error::Title looks like a release commit but '${candidate}' is not a valid semver per gitsemver."
              exit 1
            fi
          fi
          echo "version=\"${version}\" is_rc=\"${is_rc}\""
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "is_rc=${is_rc}" >> $GITHUB_OUTPUT
      - name: Check release credentials
        id: credentials
        if: ${{ steps.get_version.outputs.version != '' }}
        env:
          HAS_CLIENT_ID: ${{ secrets.RELEASE_BOT_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY != '' }}
          HAS_TAYLORBOT_TOKEN: ${{ secrets.TAYLORBOT_GITHUB_ACTION != '' }}
        run: |
          set -euo pipefail
          if [[ "${HAS_CLIENT_ID}" == "true" && "${HAS_PRIVATE_KEY}" == "true" ]]; then
            echo "use_app=true" >> "$GITHUB_OUTPUT"
          elif [[ "${HAS_CLIENT_ID}" == "true" || "${HAS_PRIVATE_KEY}" == "true" ]]; then
            echo "::error::Only one of RELEASE_BOT_CLIENT_ID and RELEASE_BOT_PRIVATE_KEY is passed. Pass both."
            exit 1
          elif [[ "${HAS_TAYLORBOT_TOKEN}" == "true" ]]; then
            echo "::warning::No giantswarm-release App secrets passed, using the deprecated taylorbot token (giantswarm/giantswarm#2280). Regenerate the workflows with devctl."
            echo "use_app=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Pass RELEASE_BOT_CLIENT_ID and RELEASE_BOT_PRIVATE_KEY (or the deprecated TAYLORBOT_GITHUB_ACTION) to this workflow."
            exit 1
          fi
      - name: Checkout code
        if: ${{ steps.get_version.outputs.version != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get project.go path
        id: get_project_go_path
        if: ${{ steps.get_version.outputs.version != '' }}
        run: |
          path='./pkg/project/project.go'
          if [[ ! -f $path ]] ; then
            path=''
          fi
          echo "path=\"$path\""
          echo "path=${path}" >> $GITHUB_OUTPUT
  update_project_go:
    name: Update project.go
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    if:
      ${{ needs.gather_facts.outputs.version != '' && needs.gather_facts.outputs.project_go_path != '' }}
    needs:
      - gather_facts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitsemver
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: "gitsemver"
          # renovate: datasource=github-releases depName=giantswarm/gitsemver
          version: v3.0.8
          # Raw binary, not the legacy `-${version}-linux-amd64.tar.gz`: those tarballs only exist
          # for repos passing `build-release-artifacts: true` below, and gitsemver stopped doing
          # that in giantswarm/gitsemver#260. Extension-less URLs skip unarchiving, so no
          # `tarball_binary_path` is needed.
          download_url: "https://github.com/giantswarm/${binary}/releases/download/${version}/${binary}-linux-amd64"
          smoke_test: "${binary} --version"
      - name: Update project.go
        id: update_project_go
        env:
          branch: "${{ github.ref }}-version-bump"
          IS_RC: "${{ needs.gather_facts.outputs.is_rc }}"
          # Refs and job outputs come in through env, never as ${{ }} in the script: a ref
          # name may contain $, ( and backticks, which the shell would run.
          PROJECT_GO_PATH: ${{ needs.gather_facts.outputs.project_go_path }}
          VERSION: ${{ needs.gather_facts.outputs.version }}
        run: |
          set -euo pipefail
          git checkout -b "${branch}"
          file="${PROJECT_GO_PATH}"
          version="${VERSION}"
          if [[ "${IS_RC}" == "true" ]]; then
            # An RC like 1.3.0-rc.1 returns project.go to the dev string for the
            # stable it is leading toward (1.3.0-dev). This way successive RCs
            # do not drift project.go forward and the final stable release lands
            # on the version project.go already advertises.
            new_version="${version%-rc.*}-dev"
          else
            new_version="$(gitsemver next patch --last-tag "v${version}")-dev"
          fi
          echo "version=\"$version\" new_version=\"$new_version\""
          echo "new_version=${new_version}" >> $GITHUB_OUTPUT
          sed -Ei "s/(version[[:space:]]*=[[:space:]]*)\"${version}\"/\1\"${new_version}\"/" "$file"
          if git diff --exit-code "$file" ; then
            echo "error: no changes in \"$file\"" >&2
            exit 1
          fi
      - name: Generate release token
        id: release_token
        if: ${{ needs.gather_facts.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Set up git identity
        env:
          USE_APP: ${{ needs.gather_facts.outputs.use_app }}
          APP_SLUG: ${{ steps.release_token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: |
          if [[ "${USE_APP}" == "true" ]]; then
            # The noreply email needs the bot's user id, the API knows it from the App slug.
            bot_name="${APP_SLUG}[bot]"
            bot_id="$(gh api "/users/${bot_name}" --jq .id)"
            git config --local user.name "${bot_name}"
            git config --local user.email "${bot_id}+${bot_name}@users.noreply.github.com"
          else
            git config --local user.email "dev@giantswarm.io"
            git config --local user.name "taylorbot"
          fi
      - name: Commit changes
        env:
          PROJECT_GO_PATH: ${{ needs.gather_facts.outputs.project_go_path }}
          NEW_VERSION: ${{ steps.update_project_go.outputs.new_version }}
        run: |
          file="${PROJECT_GO_PATH}"
          git add "$file"
          git commit -m "chore: bump version to ${NEW_VERSION}"
      - name: Push changes
        env:
          REMOTE_REPO:
            "https://x-access-token:${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}@github.com/${{
            github.repository }}.git"
          branch: "${{ github.ref }}-version-bump"
        run: |
          git push "${REMOTE_REPO}" "HEAD:${branch}"
      - name: Create PR
        env:
          GITHUB_TOKEN: "${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}"
          base: "${{ github.ref }}"
          branch: "${{ github.ref }}-version-bump"
          version: "${{ needs.gather_facts.outputs.version }}"
          title: "chore: bump version to ${{ steps.update_project_go.outputs.new_version }}"
          ACTOR: ${{ github.actor }}
        run: |
          gh pr create --title "${title}" --body "" \
            --base "${base}" --head "${branch}" --reviewer "${ACTOR}"
      - name: Enable auto-merge for PR
        env:
          GITHUB_TOKEN: "${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}"
          GH_REPO: "${{ github.repository }}"
          branch: "${{ github.ref }}-version-bump"
        run: |
          # gh finds a pull request by its branch name, not by the full ref: with
          # refs/heads/... it answered "no pull requests found" and auto-merge was never enabled.
          head="${branch#refs/heads/}"
          gh pr merge --auto --squash "${head}" \
            || echo "::warning::Could not enable auto-merge on ${head} (see the error above). Check that the repository allows auto-merge, otherwise merge the pull request by hand."
  create_release:
    name: Create release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    needs:
      - gather_facts
    if: ${{ needs.gather_facts.outputs.version }}
    outputs:
      upload_url: ${{ steps.create_gh_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Ensure correct version in project.go
        if: ${{ needs.gather_facts.outputs.project_go_path != '' }}
        env:
          PROJECT_GO_PATH: ${{ needs.gather_facts.outputs.project_go_path }}
          VERSION: ${{ needs.gather_facts.outputs.version }}
        run: |
          file="${PROJECT_GO_PATH}"
          version="${VERSION}"
          grep -qE "version[[:space:]]*=[[:space:]]*\"$version\"" "$file"
      - name: Get Changelog Entry
        id: changelog_reader
        env:
          VERSION: ${{ needs.gather_facts.outputs.version }}
        run: |
          set -euo pipefail
          entry=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found = 1; next }
            }
            found {
              if ($0 ~ /^\[[^]]+\]:[ \t]*https?:\/\//) next
              if (!started && $0 ~ /^[[:space:]]*$/) next
              started = 1
              buf[++n] = $0
            }
            END {
              while (n > 0 && buf[n] ~ /^[[:space:]]*$/) n--
              for (i = 1; i <= n; i++) print buf[i]
            }
          ' ./CHANGELOG.md)

          if [ -z "$(printf %s "$entry" | tr -d '[:space:]')" ]; then
            echo "::error::No changelog entry found for version $VERSION in ./CHANGELOG.md"
            exit 1
          fi

          {
            echo "changes<<__GHA_EOF__"
            printf '%s\n' "$entry"
            echo "__GHA_EOF__"
          } >> "$GITHUB_OUTPUT"
      - name: Generate release token
        id: release_token
        if: ${{ needs.gather_facts.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Set up git identity
        env:
          USE_APP: ${{ needs.gather_facts.outputs.use_app }}
          APP_SLUG: ${{ steps.release_token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: |
          if [[ "${USE_APP}" == "true" ]]; then
            # The noreply email needs the bot's user id, the API knows it from the App slug.
            bot_name="${APP_SLUG}[bot]"
            bot_id="$(gh api "/users/${bot_name}" --jq .id)"
            git config --local user.name "${bot_name}"
            git config --local user.email "${bot_id}+${bot_name}@users.noreply.github.com"
          else
            git config --local user.email "dev@giantswarm.io"
            git config --local user.name "taylorbot"
          fi
      - name: Create tag
        env:
          VERSION: ${{ needs.gather_facts.outputs.version }}
        run: |
          version="${VERSION}"
          git tag "v$version" "${GITHUB_SHA}"
      - name: Push tag
        env:
          REMOTE_REPO:
            "https://x-access-token:${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}@github.com/${{
            github.repository }}.git"
        run: |
          git push "${REMOTE_REPO}" --tags
      - name: Create release
        id: create_gh_release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          body: ${{ steps.changelog_reader.outputs.changes }}
          tag: "v${{ needs.gather_facts.outputs.version }}"
          token: ${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}
          # Mark release-candidate versions (vX.Y.Z-rc.N) as GitHub pre-releases
          # so they don't surface as the repo's "Latest release".
          prerelease: ${{ needs.gather_facts.outputs.is_rc == 'true' }}
          skipIfReleaseExists: true

  create-release-branch:
    name: Create release branch
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    needs:
      - gather_facts
    if: ${{ needs.gather_facts.outputs.version && needs.gather_facts.outputs.is_rc != 'true' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history with every branch and tag, fetched with the
          # checkout's own token, so a private repository needs no second fetch.
          fetch-depth: 0
          persist-credentials: false
      - name: Generate release token
        id: release_token
        if: ${{ needs.gather_facts.outputs.use_app == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Create long-lived release branch
        env:
          REMOTE_REPO:
            "https://x-access-token:${{ steps.release_token.outputs.token || secrets.TAYLORBOT_GITHUB_ACTION }}@github.com/${{
            github.repository }}.git"
          VERSION: ${{ needs.gather_facts.outputs.version }}
        run: |
          set -euo pipefail
          current_version="${VERSION}"
          parent_version="$(git describe --tags --abbrev=0 HEAD^ || true)"
          parent_version="${parent_version#v}" # Strip "v" prefix.

          if [[ -z "$parent_version" ]] ; then
            echo "Unable to find a parent tag version. No branch to create."
            exit 0
          fi

          echo "current_version=$current_version parent_version=$parent_version"

          # Strip any pre-release suffix before splitting on '.', so a parent tag
          # that happens to be an RC (e.g. 1.2.3-rc.4) is treated as 1.2.3 for
          # the comparison.
          IFS=. read -r current_major current_minor _ <<<"${current_version%%-*}"
          IFS=. read -r parent_major parent_minor _ <<<"${parent_version%%-*}"
          echo "current_major=$current_major current_minor=$current_minor"
          echo "parent_major=$parent_major parent_minor=$parent_minor"

          if [[ $current_major -gt $parent_major ]] ; then
            echo "Current tag is a new major version"
          elif [[ $current_major -eq $parent_major ]] && [[ $current_minor -gt $parent_minor ]] ; then
            echo "Current tag is a new minor version"
          else
            echo "Current tag is not a new major or minor version. Nothing to do here."
            exit 0
          fi

          release_branch="release-v${parent_major}.${parent_minor}.x"
          echo "release_branch=$release_branch"

          if git rev-parse --verify --quiet "refs/remotes/origin/$release_branch" >/dev/null; then
            echo "Release branch $release_branch already exists. Nothing to do here."
            exit 0
          fi

          git branch "$release_branch" HEAD^
          git push "${REMOTE_REPO}" "$release_branch"

  create_and_upload_build_artifacts:
    name: Create and upload build artifacts
    runs-on: ubuntu-26.04
    if: ${{ inputs.build-release-artifacts && needs.gather_facts.outputs.version }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - darwin-amd64
          - linux-amd64
          - darwin-arm64
          - linux-arm64
          - windows-amd64
    env:
      # renovate: datasource=golang-version depName=go
      GO_VERSION: 1.26.3
      ARTIFACT_DIR: bin-dist
      TAG: v${{ needs.gather_facts.outputs.version }}
    needs:
      - create_release
      - gather_facts
    steps:
      # Transitional: only needed by consumer Makefiles still on the pre-gitsemver
      # devctl template, where `VERSION := $(shell architect project version)`
      # stamps the release artifacts. devctl's current template uses
      # `gitsemver version` (installed below), so this install can be dropped
      # once all consumers have regenerated their Makefile.gen.go.mk.
      - name: Install architect
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: "architect"
          version: "6.14.1"
      - name: Install gitsemver
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: "gitsemver"
          # renovate: datasource=github-releases depName=giantswarm/gitsemver
          version: v3.0.8
          # Raw binary, not the legacy `-${version}-linux-amd64.tar.gz`: those tarballs only exist
          # for repos passing `build-release-artifacts: true` below, and gitsemver stopped doing
          # that in giantswarm/gitsemver#260. Extension-less URLs skip unarchiving, so no
          # `tarball_binary_path` is needed.
          download_url: "https://github.com/giantswarm/${binary}/releases/download/${version}/${binary}-linux-amd64"
          smoke_test: "${binary} --version"
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # Strings ('0' / '1') are required because the GHA ternary idiom
          # `cond && A || B` only works when A is truthy. The number `0`
          # is falsy, so `cond && 0 || 1` always evaluates to `1`.
          fetch-depth: ${{ inputs.fetch-deep-gitlog-for-build && '0' || '1' }}
      - name: Create ${{ matrix.platform }} package
        # The matrix is a literal list, and a PLATFORM env var would reach make as a variable.
        run: make package-${{ matrix.platform }}
      - name: Specify package file name based on platform
        env:
          PLATFORM: ${{ matrix.platform }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [[  "${PLATFORM}" == "windows-amd64" ]]; then
            echo "FILE_NAME=${REPO_NAME}-${TAG}-${PLATFORM}.zip" >> $GITHUB_ENV
          else
            echo "FILE_NAME=${REPO_NAME}-${TAG}-${PLATFORM}.tar.gz" >> $GITHUB_ENV
          fi
      - name: Add ${{ matrix.platform }} package to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" \
          "${ARTIFACT_DIR}/${FILE_NAME}#${FILE_NAME}"
