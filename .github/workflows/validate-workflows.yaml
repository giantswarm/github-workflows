name: Validate GitHub workflows

on:
  pull_request:
    paths:
      - '.github/workflows/*.yaml'
  workflow_dispatch: {}

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate YAML
        run: |
          set +e

          # Run yamllint and capture output
          docker run --rm -v "$PWD:/data" -w /data \
            gsoci.azurecr.io/giantswarm/yamllint:1.37.1 \
            --format=parsable . > yamllint-output.txt 2>&1

          exit_code=$?

          # Write summary only if there are failures
          if [ "${exit_code}" -ne 0 ]; then
            {
              echo "## YAML Validation Results"
              echo ""
              echo "❌ Found issues in the following files:"
              echo ""

              # Extract and format only lines with errors
              if [ -s yamllint-output.txt ]; then
                echo '```'
                grep '\[error\]' yamllint-output.txt || echo "No errors found in output"
                echo '```'
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          # Clean up
          rm -f yamllint-output.txt

          # Exit with the original exit code
          exit "${exit_code}"

      - name: Validate GitHub Actions
        uses: jazzsequence/github-action-validator@863579565c8771e1d64646e44ad5ff4884eac85f # v1.0.5
        with:
          show-ascii-art: false
          path-to-workflows: '.github/workflows/*.yaml'

  actionlint:
    name: Lint workflows with actionlint and shellcheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and shellcheck
        run: |
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -C "${bin}" actionlint
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum -c -
          tar -xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" --strip-components=1 -C "${bin}" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "${bin}" >> "$GITHUB_PATH"

      - name: Run actionlint
        # Every actionlint check and every shellcheck error that stops a
        # script from parsing (SC1xxx, such as a shellcheck directive in the
        # wrong syntax, which then disables nothing) fails the job. The
        # SC2xxx style warnings are ignored until the older workflows are
        # cleaned up.
        run: |
          shellcheck --version
          actionlint -color -ignore 'SC2[0-9]{3}:' .github/workflows/*.yaml

  analyze-actions:
    name: Analyze workflows with zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab (code scanning is enabled)
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocking: no `${{ }}` expression may sit inside a `run:` script, which is how a PR
      # title or branch name becomes shell. Pass the value through `env:` instead. zizmor has
      # no rule selector, so the findings are filtered on the rule id; every other audit
      # stays report-only below.
      - name: Block on template-injection findings
        run: |
          # --no-exit-codes: a non-zero exit then means zizmor itself broke, not that it found something
          docker run --rm -v "$PWD:/data" -w /data \
            ghcr.io/zizmorcore/zizmor:1.31.0@sha256:5a91180aefd2c72e585a155ee15938ecc2911b64e7fade998bf79fbd16a07856 \
            --persona regular --no-online-audits --no-exit-codes --format json .github/workflows > "$RUNNER_TEMP/zizmor.json"
          findings=$(jq -r '.[] | select(.ident == "template-injection") | "\(.locations[0].symbolic.key.Local.verbatim_path):\(.locations[0].concrete.location.start_point.row + 1): \(.desc)"' "$RUNNER_TEMP/zizmor.json")
          if [ -n "$findings" ]; then
            echo "::error::template-injection: pass expression values to run scripts through env instead of interpolating them"
            echo "$findings"
            exit 1
          fi

      # Report-only: zizmor uploads every other finding to the Security tab for visibility
      # but never blocks PRs. The repo carries pre-existing findings that are tracked
      # separately. See giantswarm/giantswarm#36940.
      - name: Run zizmor (non-blocking)
        continue-on-error: true
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: regular
